apiVersion: 1

providers:
  - name: 'kale-dashboards'
    orgId: 1
    folder: 'Kale Monitor'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/definitions
      foldersFromFilesStructure: false
