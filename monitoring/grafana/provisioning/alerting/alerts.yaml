apiVersion: 1

groups:
  - orgId: 1
    name: KaleProductionAlerts
    folder: "Kale Monitor"
    interval: 10s
    rules:
      # 1. APPLICATION DOWN
      - uid: alert-app-down
        title: "Application DOWN"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="kale-app"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: eq
                    params: [0]
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Uygulama çöktü veya ulaşılamıyor!"
          description: "kale-app servisi 30 saniyedir yanıt vermiyor."

      # 2. CPU > %80
      - uid: alert-cpu-high
        title: "CPU Usage > 80%"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Yüksek CPU Kullanımı!"
          description: "Sistem CPU kullanımı son 1 dakikadır %80 eşiğinin üzerinde."

      # 3. DISK > %85
      - uid: alert-disk-high
        title: "Disk Usage > 85%"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"})
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Kritik Disk Doluluğu!"
          description: "Kök dizin (/) disk doluluk oranı %85 üzerinde."

      # 4. HTTP 5xx > %5 (Personel 503 Toleranslı Güncelleme)
      - uid: alert-http-500-rate
        title: "HTTP 500 Error Rate > 5%"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              # Personel endpoint'inin beklenen 503 hataları hariç tutulmuştur
              expr: (sum(rate(http_requests_total{status=~"5..", route!~".*personel.*"}[1m])) or vector(0)) / (sum(rate(http_requests_total[1m])) > 0) * 100
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Yüksek HTTP 500 Hata Oranı!"
          description: "Gelen isteklerin %5'inden fazlası son 1 dakikadır 500 hatası alıyor (Personel servisinin beklenen 503 yanıtları tolere edilmiştir)."

      # 5. REDIS BELLEK DOLULUĞU (> %85)
      - uid: alert-redis-memory-high
        title: "Redis Memory Usage > 85%"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kritik Redis Bellek Doluluğu!"
          description: "Redis bellek doluluğu %85 eşiğini aştı. noeviction politikası devrede olduğundan bellek dolarsa yeni oturum yazma işlemleri duracaktır."

      # 6. BRUTE-FORCE / GÜVENLİK (Loki Kaynaklı Alarm)
      - uid: alert-brute-force-login
        title: "Brute-Force Denemesi Tespiti (>20 Hatalı Giriş / 5dk)"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              editorMode: code
              expr: sum(count_over_time({job="kale-service"} |= "Login basarisiz" [5m]))
              instant: true
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [20]
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Olası Brute-Force Saldırısı!"
          description: "Son 5 dakika içerisinde 20'den fazla başarısız giriş denemesi tespit edildi."
