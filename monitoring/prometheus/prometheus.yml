global:
  scrape_interval: 5s # Her 5 saniyede bir veri topla

scrape_configs:
  # Sunucu metrikleri (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'kale-app'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['kale-app:3000']
  # Kendi kendini izleme
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
