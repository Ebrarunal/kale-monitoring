services:
  # 1. Metrik Toplayıcı: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: kale-prometheus
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - kale-net

  # 2. Sunucu ve Sistem Metrikleri: Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: kale-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "9100:9100"
    networks:
      - kale-net

  # 3. Log Deposu: Loki
  loki:
    image: grafana/loki:latest
    container_name: kale-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    networks:
      - kale-net

  # 4. Görselleştirme: Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: kale-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - kale-net

  # 5. Log Ajanı: Grafana Alloy
  alloy:
    image: grafana/alloy:latest
    container_name: kale-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ../monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../app/logs:/var/log/app:ro
    ports:
      - "12345:12345"
    depends_on:
      - loki
    networks:
      - kale-net

  # 6. Veritabanı: MySQL
  mysql:
    image: mysql:8.0
    container_name: kale-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kale_db
      MYSQL_USER: kale_user
      MYSQL_PASSWORD: kale_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kale_user", "-pkale_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - kale-net

  # 7. Web Uygulaması: Kale App
  kale-app:
    build: ../app
    container_name: kale-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DB_HOST: mysql
      DB_USER: kale_user
      DB_PASSWORD: kale_password
      DB_NAME: kale_db
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ../app/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
	condition: service_healthy
    networks:
      - kale-net
  #8
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: kale-mysqld-exporter
    environment:
      - DATA_SOURCE_NAME=exporter:exporter_password@(kale-mysql:3306)/
    command:
      - "--mysqld.address=kale-mysql:3306"
      - "--mysqld.username=exporter:exporter_password"
    ports:
      - "9104:9104"
    networks:
      - kale-net
    restart: unless-stopped
  #9
  redis:
    image: redis:7-alpine
    container_name: kale-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - kale-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0-alpine
    container_name: kale-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - kale-net
    depends_on:
      redis:
        condition: service_healthy
networks:
  kale-net:
    driver: bridge

volumes:
  grafana-data:
  prometheus-data:
  mysql-data:
  redis-data:
